# =============================================================================
# BUILD 3.0 -- training-time ablation: PG-CrossAttention bias DISABLED.
#
# Byte-for-byte identical to configs/models/build_sbdd_full.yaml except for
# exactly three keys, so the two training runs differ in one variable:
#   model.use_physics_bias : true -> false
#   experiment_name        : renamed
#   training.checkpoint_dir: separate output directory
#
# Launch with:
#   bash scripts/run_8gpu.sh --config configs/models/build_sbdd_no_physics.yaml
# =============================================================================
experiment_name: "Project_BUILD_SBDD_NoPhysicsBias"
seed: 42

dataset:
  lmdb_dir: "data/crossdocked/crossdocked_lmdb"
  split_type: "name"
  batch_size: 128
  num_workers: 4
  pocket_radius: 10.0
  max_pocket_atoms: 256

model:
  type: "TargetSBDDBackbone"
  num_lig_types: 9
  num_pocket_types: 6
  max_lig_atoms: 100
  hidden_dim: 128
  num_layers: 6
  num_heads: 4
  use_physics_bias: false
  physics_bias_cfg:
    type: "LennardJonesCoulombBias"
    sigma_default: 1.7
    epsilon_default: 0.15
    min_clamp: -50.0

physics:
  valency_potential:
    type: "ContinuousValencyPotential"
    scale: 0.5
    bond_sigma: 0.40
  scheduler:
    type: "SNRSigmoidScheduler"
    lambda_max: 1.0
    k: 2.0
    tau: 0.0

diffusion:
  schedule_type: "cosine"

training:
  epochs: 100
  warmup_epochs: 3
  lr: 3.0e-4
  min_lr: 1.0e-6
  weight_decay: 1.0e-6
  clip_grad_norm: 1.0
  val_interval: 5
  sample_eval_count: 50
  checkpoint_dir: "checkpoints/sbdd_no_physics"
